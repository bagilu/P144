<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研究亮點｜慈濟大學經營管理學系</title>
  <meta name="description" content="瀏覽慈濟大學經營管理學系教師研究成果，依作者與年份篩選，查看研究內容及可查證的學術來源。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css?v=20261124-p41-mei-hui-su">
  <script defer src="assets/js/layout.js?v=20261124-nav-update"></script>
  <script defer src="assets/js/site.js"></script>
  <script defer src="assets/js/research.js?v=20261124-hsu"></script>
</head>
<body>
  <a class="p144-skip" href="#main">跳至主要內容</a>
  <div id="site-header" class="p144-layout-header">
    <nav class="p144-layout-fallback" aria-label="基本導覽"><a href="index.html">系所簡介</a> · <a href="p2.html">系所成員</a> · <a href="p3.html">課程資訊</a> · <a href="p4.html">教研成果</a> · <a href="p5.html">招生專區</a> · <a href="p6.html">師生專區</a></nav>
  </div>
  <main id="main" data-research-page>
    <section class="p144-research-detail-hero" aria-labelledby="research-title">
      <div class="p144-container">
        <div class="p144-research-detail-copy">
          <p class="p144-research-detail-kicker">RESEARCH HIGHLIGHTS</p>
          <h1 id="research-title">研究亮點</h1>
          <p>從教師研究出發，理解研究問題、發現與應用，並連結可查證的學術來源。</p>
        </div>
      </div>
    </section>

    <section class="p144-academic-section p144-research-list-section" aria-labelledby="research-list-heading">
      <div class="p144-container">
        <header class="p144-research-list-intro">
          <span class="p144-section-pretitle">RESEARCH &amp; DISCOVERY</span>
          <h2 id="research-list-heading">研究成果一覽</h2>
          <p>本頁整理系上教師研究成果。研究內容依公開摘要與書目資料整理；完整書目與來源可展開查閱。</p>
        </header>

        <form class="p144-research-controls" role="search" onsubmit="return false">
          <div class="p144-research-search">
            <label for="research-search">關鍵字</label>
            <input id="research-search" type="search" placeholder="搜尋著作名稱、作者或研究內容">
          </div>
          <div>
            <label for="research-author">作者</label>
            <select id="research-author">
              <option value="">所有教師</option>
              <option value="林珍如">林珍如</option>
              <option value="林信宏">林信宏</option>
              <option value="蘇美惠">蘇美惠</option>
              <option value="郭又銘">郭又銘</option>
              <option value="徐宜成">徐宜成</option>
            </select>
          </div>
          <div>
            <label for="research-year">年份</label>
            <select id="research-year"><option value="">所有年份</option></select>
          </div>
          <div>
            <label for="research-sort">排序方式</label>
            <select id="research-sort">
              <option value="random" selected>隨機排列</option>
              <option value="year-desc">年份由新到舊</option>
              <option value="year-asc">年份由舊到新</option>
              <option value="author">依作者排序</option>
              <option value="title">依著作名稱排序</option>
            </select>
          </div>
        </form>

        <p id="research-count" class="p144-research-count" aria-live="polite">正在載入研究成果…</p>
        <div id="research-list" class="p144-research-list" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"><footer class="p144-layout-fallback">慈濟大學 經營管理學系</footer></div>
</body>
</html>
